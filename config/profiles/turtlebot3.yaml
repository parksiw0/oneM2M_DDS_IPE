# TurtleBot3 Burger 실기 프로파일 (ROS 2 Humble, LDS-02).
# 2026-07-21 로봇에서 확인한 그래프 전체: topic 13, service 28, action 0.
# PC 실행: python3 main.py config/profiles/turtlebot3.yaml. 로봇 env: tools/tb3_env.sh.
# 사전 조건: tinyIoT에 config/sdt/ros-ipe.fcp 배포 후 재시작.
#
# /rosout·/parameter_events와 노드별 파라미터 서비스도 실측 목록 보존을 위해
# 포함한다. IPE 자체도 이 두 인프라 토픽에 endpoint를 만들 수 있으므로 실기
# 비교는 IPE를 띄우기 전에 tools/verify_turtlebot3_interfaces.sh로 수행한다.
# 실측 RMW가 depth를 UNKNOWN으로 보고하므로 reliability/durability/lifespan은
# 실측값, depth는 각 Humble publisher/service 생성 소스의 선언값을 사용한다.

ipe: { instance_id: tb3-ipe }

cse:
  endpoint: http://localhost:3000
  cse_base: TinyIoT
  ae_name: tb3-ipe
  origin: CAdmin
  rvi: "3"
  poa: http://127.0.0.1:5050

notification_server: { host: 0.0.0.0, port: 5050 }

robots:
  - { id: tb3, namespace: "" }

discovery:
  mode: config-only            # 아래 실측 인터페이스만 브리지
  refresh_sec: 5               # endpoint/QoS 재조정 폴 주기
  domain_id: 30                # 기록용 — 실제 적용은 ROS_DOMAIN_ID env

naming: { path_style: nested, sanitize: "_" }

storage: { state_db: tb3_ipe_state.db }

policy:
  confirmation: auto
  qos_strictness: reject

qos_profiles:
  sensor_stream:               # /scan: rclcpp::SensorDataQoS
    reliability: BEST_EFFORT
    durability: VOLATILE
    history: KEEP_LAST
    depth: 5
  state_reliable:              # TurtleBot3 센서·odom 기본 publisher QoS
    reliability: RELIABLE
    durability: VOLATILE
    history: KEEP_LAST
    depth: 10
  tf_dynamic:                  # tf2_ros::DynamicBroadcasterQoS
    reliability: RELIABLE
    durability: VOLATILE
    history: KEEP_LAST
    depth: 100
  latched_state:               # /tf_static, /robot_description
    reliability: RELIABLE
    durability: TRANSIENT_LOCAL
    history: KEEP_LAST
    depth: 1
  parameter_events:            # rmw_qos_profile_parameter_events
    reliability: RELIABLE
    durability: VOLATILE
    history: KEEP_LAST
    depth: 1000
  rosout_state:                # rcl_qos_profile_rosout_default
    reliability: RELIABLE
    durability: TRANSIENT_LOCAL
    history: KEEP_LAST
    depth: 1000
  cmd_reliable:                # /cmd_vel subscriber의 requested QoS
    reliability: RELIABLE
    durability: VOLATILE
    history: KEEP_LAST
    depth: 10
  service_default:             # 일반 서비스: rmw_qos_profile_services_default
    reliability: RELIABLE
    durability: VOLATILE
    history: KEEP_LAST
    depth: 10
  parameter_service:           # 노드 파라미터 서비스: rmw_qos_profile_parameters
    reliability: RELIABLE
    durability: VOLATILE
    history: KEEP_LAST
    depth: 1000

defaults:
  service:
    qos: service_default
    timeout_ms: 5000
    access: { enabled: true }

qos_fcnt:
  allow_update: false          # 원격 QoS 변경 데모 시 true

bridge:
  topics:
    # --- 관측: 실시간 센서/상태 (샘플링 없이 수신 전량 저장) ---
    - name: /scan
      type: sensor_msgs/msg/LaserScan
      qos: sensor_stream
      representation: historical
    - name: /odom
      type: nav_msgs/msg/Odometry
      qos: state_reliable
      representation: historical
    - name: /imu
      type: sensor_msgs/msg/Imu
      qos: state_reliable
      representation: historical
    - name: /magnetic_field
      type: sensor_msgs/msg/MagneticField
      qos: state_reliable
      representation: historical
    - name: /joint_states
      type: sensor_msgs/msg/JointState
      qos: state_reliable
      representation: historical
    - name: /sensor_state
      type: turtlebot3_msgs/msg/SensorState
      qos: state_reliable
      representation: historical
    - name: /battery_state
      type: sensor_msgs/msg/BatteryState
      qos: state_reliable
      representation: historical
      stale_after_ms: 15000
    - name: /tf
      type: tf2_msgs/msg/TFMessage
      qos: tf_dynamic
      representation: historical

    # --- 관측: 래치(1회/변경 시 발행) ---
    - name: /tf_static
      type: tf2_msgs/msg/TFMessage
      qos: latched_state
      representation: latest
      stale_after_ms: 0
    - name: /robot_description
      type: std_msgs/msg/String
      qos: latched_state
      representation: latest
      stale_after_ms: 0

    # --- 관측: ROS 2 인프라 토픽도 실측 목록대로 포함 ---
    - name: /parameter_events
      type: rcl_interfaces/msg/ParameterEvent
      qos: parameter_events
      representation: historical
      stale_after_ms: 0
    - name: /rosout
      type: rcl_interfaces/msg/Log
      qos: rosout_state
      representation: historical
      stale_after_ms: 0

    # --- 명령 토픽 ---
    - name: /cmd_vel
      type: geometry_msgs/msg/Twist
      direction: command
      qos: cmd_reliable
      access: { enabled: true }
      command:
        rate_limit_hz: 10
        clamp:                              # Burger 물리 한계
          linear.x: [-0.22, 0.22]
          angular.z: [-2.84, 2.84]
        watchdog_ms: 500                    # 명령 두절 시 정지 페이로드
        max_age_ms: 2000                    # 낡은 명령 폐기

  services:
    # --- diff_drive_controller 파라미터 서비스 6개 ---
    - name: /diff_drive_controller/describe_parameters
      type: rcl_interfaces/srv/DescribeParameters
      qos: parameter_service
    - name: /diff_drive_controller/get_parameter_types
      type: rcl_interfaces/srv/GetParameterTypes
      qos: parameter_service
    - name: /diff_drive_controller/get_parameters
      type: rcl_interfaces/srv/GetParameters
      qos: parameter_service
    - name: /diff_drive_controller/list_parameters
      type: rcl_interfaces/srv/ListParameters
      qos: parameter_service
    - name: /diff_drive_controller/set_parameters
      type: rcl_interfaces/srv/SetParameters
      qos: parameter_service
    - name: /diff_drive_controller/set_parameters_atomically
      type: rcl_interfaces/srv/SetParametersAtomically
      qos: parameter_service

    # --- ld08_driver 파라미터 서비스 6개 ---
    - name: /ld08_driver/describe_parameters
      type: rcl_interfaces/srv/DescribeParameters
      qos: parameter_service
    - name: /ld08_driver/get_parameter_types
      type: rcl_interfaces/srv/GetParameterTypes
      qos: parameter_service
    - name: /ld08_driver/get_parameters
      type: rcl_interfaces/srv/GetParameters
      qos: parameter_service
    - name: /ld08_driver/list_parameters
      type: rcl_interfaces/srv/ListParameters
      qos: parameter_service
    - name: /ld08_driver/set_parameters
      type: rcl_interfaces/srv/SetParameters
      qos: parameter_service
    - name: /ld08_driver/set_parameters_atomically
      type: rcl_interfaces/srv/SetParametersAtomically
      qos: parameter_service

    # --- robot_state_publisher 파라미터 서비스 6개 ---
    - name: /robot_state_publisher/describe_parameters
      type: rcl_interfaces/srv/DescribeParameters
      qos: parameter_service
    - name: /robot_state_publisher/get_parameter_types
      type: rcl_interfaces/srv/GetParameterTypes
      qos: parameter_service
    - name: /robot_state_publisher/get_parameters
      type: rcl_interfaces/srv/GetParameters
      qos: parameter_service
    - name: /robot_state_publisher/list_parameters
      type: rcl_interfaces/srv/ListParameters
      qos: parameter_service
    - name: /robot_state_publisher/set_parameters
      type: rcl_interfaces/srv/SetParameters
      qos: parameter_service
    - name: /robot_state_publisher/set_parameters_atomically
      type: rcl_interfaces/srv/SetParametersAtomically
      qos: parameter_service

    # --- turtlebot3_node 파라미터 서비스 6개 ---
    - name: /turtlebot3_node/describe_parameters
      type: rcl_interfaces/srv/DescribeParameters
      qos: parameter_service
    - name: /turtlebot3_node/get_parameter_types
      type: rcl_interfaces/srv/GetParameterTypes
      qos: parameter_service
    - name: /turtlebot3_node/get_parameters
      type: rcl_interfaces/srv/GetParameters
      qos: parameter_service
    - name: /turtlebot3_node/list_parameters
      type: rcl_interfaces/srv/ListParameters
      qos: parameter_service
    - name: /turtlebot3_node/set_parameters
      type: rcl_interfaces/srv/SetParameters
      qos: parameter_service
    - name: /turtlebot3_node/set_parameters_atomically
      type: rcl_interfaces/srv/SetParametersAtomically
      qos: parameter_service

    # --- TurtleBot3 동작 서비스 4개 ---
    - name: /motor_power
      type: std_srvs/srv/SetBool
    - name: /reset
      type: std_srvs/srv/Trigger
      timeout_ms: 10000                   # 자이로 보정에서 5초 대기
    - name: /reset_odometry
      type: std_srvs/srv/Trigger
    - name: /sound
      type: turtlebot3_msgs/srv/Sound

  actions: []                             # ros2 action list 실측 결과 없음
