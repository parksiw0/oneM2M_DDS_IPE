[build-system]
requires = ["setuptools>=68,<80", "packaging>=24.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipe"
version = "0.1.0"
description = "ROS2 to oneM2M Interworking Proxy Entity"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "acxrn"}]
license = {text = "Proprietary"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "requests>=2.31",
    "cerberus>=1.3",
    "psycopg[binary,pool]>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]
mqtt = ["paho-mqtt>=2.1"]

[project.scripts]
ipe = "ipe.cli:main"

[tool.setuptools]
py-modules = ["config"]
package-dir = {"" = ".", "ipe" = "src/ipe"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict_optional = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["cerberus.*", "paho.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rclpy.*", "rosidl_parser.*", "rosidl_runtime_py.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "."]
addopts = "-v --strict-markers --tb=short"
markers = [
    "integration: requires running TinyIoT CSE",
    "e2e: requires PX4 SITL + Agent + TinyIoT",
]
